name: AssetStudioBuild

on:
  push:
    branches: [ AssetStudioMod, master ]
  pull_request:
    branches: [ AssetStudioMod, master ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FBX_SDK_URL: "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET 9 & 10 SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install FBX SDK 2020.2.1
        run: |
          Invoke-WebRequest "$env:FBX_SDK_URL" -OutFile "$env:RUNNER_TEMP\fbxsdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\fbxsdk.exe" -ArgumentList "/S" -Wait
          if (-not (Test-Path "C:\Program Files\Autodesk\FBX\FBX SDK\2020.2.1\include")) {
            throw "FBX SDK installation failed"
          }

      - name: Build AssetStudioFBXNative (Release x64)
        run: msbuild AssetStudioFBXNative\AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Build Texture2DDecoderNative (Release x64)
        run: msbuild Texture2DDecoderNative\Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Publish GUI (net9.0, win-x64)
        run: dotnet publish AssetStudioGUI\AssetStudioGUI.csproj -c Release -f net9.0-windows -r win-x64 --self-contained false -p:SolutionDir="$env:GITHUB_WORKSPACE/"

      - name: Publish GUI (net10.0, win-x64)
        run: dotnet publish AssetStudioGUI\AssetStudioGUI.csproj -c Release -f net10.0-windows -r win-x64 --self-contained false -p:SolutionDir="$env:GITHUB_WORKSPACE/"

      - name: Publish CLI (net9.0, win-x64)
        run: dotnet publish AssetStudioCLI\AssetStudioCLI.csproj -c Release -f net9.0 -r win-x64 --self-contained false -p:SolutionDir="$env:GITHUB_WORKSPACE/"

      - name: Publish CLI (net10.0, win-x64)
        run: dotnet publish AssetStudioCLI\AssetStudioCLI.csproj -c Release -f net10.0 -r win-x64 --self-contained false -p:SolutionDir="$env:GITHUB_WORKSPACE/"

      - name: Upload GUI net9 artifact
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioModGUI.net9.win64
          path: AssetStudioGUI/bin/Release/net9.0-windows/win-x64/publish

      - name: Upload GUI net10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioModGUI.net10.win64
          path: AssetStudioGUI/bin/Release/net10.0-windows/win-x64/publish

      - name: Upload CLI net9 artifact
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioModCLI.net9.win64
          path: AssetStudioCLI/bin/Release/net9.0/win-x64/publish

      - name: Upload CLI net10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioModCLI.net10.win64
          path: AssetStudioCLI/bin/Release/net10.0/win-x64/publish
